services:
  postgres:
    image: postgres:15-alpine
    container_name: bank-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankdb
    ports:
      - "5432:5432"
    volumes:
      # This saves your data so it isn't wiped out every time you stop the container
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: